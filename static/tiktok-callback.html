<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Connect TikTok | The Ledger</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f6f2ec;color:#1d1a16;max-width:560px;margin:40px auto;padding:0 16px}
code{display:block;word-break:break-all;background:#fff;border:1px solid #e4dccf;padding:12px;border-radius:6px;font-size:14px}
button{margin-top:10px;padding:10px 16px;border:0;border-radius:6px;background:#1d1a16;color:#fff;font-size:15px}</style></head>
<body><h1>Connect TikTok</h1><div id="out"></div>
<script>
var p=new URLSearchParams(location.search),c=p.get('code'),o=document.getElementById('out');
if(c){o.innerHTML='<p>Copy this code. In GitHub go to Actions, Daily run, Run workflow, and paste it into <b>tiktok_code</b>. It works once and expires in a few minutes.</p><code id="c"></code><button id="b">Copy code</button>';
document.getElementById('c').textContent=c;document.getElementById('b').onclick=function(){navigator.clipboard.writeText(c);this.textContent='Copied'};}
else{o.textContent=p.get('error_description')||'No code found. Start the connection again from TikTok.';}
</script></body></html>
