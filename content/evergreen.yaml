# Evergreen Instagram carousels, posted on days with no real price data.
# Short copy: one idea per slide, under 14 words of body text.
# The first post is the pinned "About" post.

- slug: about
  caption: |
    What The Ledger is, in 30 seconds.

    We check hundreds of designer and niche fragrance prices across UK retailers every morning. We post a drop only when a bottle is at least 10% and £5 below its own 30-day price.

    What we never do: quote fake RRPs, post the same deal twice, or list grey-market sellers. Some links earn us a small commission. It never changes what we post.

    Every bottle, every price, every day: theledgeruk.co.uk
  slides:
    - kicker: About
      title: What The Ledger is,
      italic: in 30 seconds.
    - title: What we do
      body: Check hundreds of UK fragrance prices every morning.
    - title: How we judge a drop
      body: At least 10% and £5 below that bottle's own 30-day price.
    - title: What we never do
      body: Fake RRPs. Repeated deals. Grey-market sellers.
    - title: How we earn
      body: Some links pay us a small commission. It never changes what we post.

- slug: price-per-ml
  caption: |
    The 100ml is usually the real deal.

    50ml at £60 is £1.20 per ml. 100ml at £85 is £0.85 per ml. Same juice, 30% less.

    Only go big if you'll finish it in 2–3 years. We show £ per 10ml on every bottle.

    theledgeruk.co.uk
