    - title: How it works
      points:
        - h: We check every morning
          b: Hundreds of designer and niche fragrances across UK retailers, before the shops open.
        - h: Each bottle against its own history
          b: We compare today's price with what that exact bottle cost over the last 30 days. Not a made-up RRP.
        - h: Only real drops get posted
