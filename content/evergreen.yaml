- slug: when-to-buy
  caption: |
    Best months to buy fragrance in the UK.

    January for clearouts. Late November for Black Friday. August before autumn launches.

    Avoid the two weeks before Christmas and Valentine's. Or skip the calendar: we check every morning.

    theledgeruk.co.uk
  slides:
    - kicker: Timing
      title: Best months to buy
      italic: fragrance in the UK.
    - title: Buy
      body: January. Late November. August.
    - title: Avoid
      body: The two weeks before Christmas and Valentine's.

- slug: our-rules
  caption: |
    Three rules before we call it a drop.

    1. At least 10% below the bottle's own 30-day median.
    2. At least £5 off.
    3. Not already announced this month.

    Fail one and we stay quiet. That's why you can trust what we do post.

    theledgeruk.co.uk
