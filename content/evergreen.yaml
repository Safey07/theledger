    - title: Rule two
      body: At least £5 off.
    - title: Rule three
      body: Not already announced this month.

- slug: fake-rrp-2
  caption: |
    "RRP" is not a price anyone paid.

    Most bottles never sell at RRP. A "saving" against it is a saving against nothing.

    Ask one question: what did this bottle cost last month? That's the only number we use.

    theledgeruk.co.uk
  slides:
    - kicker: Pricing explained
      title: '"RRP" is not a price'
      italic: anyone paid.
    - title: The trick
      body: Most bottles never sell at RRP. The "saving" is against nothing.
    - title: The honest question
      body: What did this bottle cost last month?
