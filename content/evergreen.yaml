- slug: fake-rrp
  caption: |
    "Was £120, now £60" is often a lie.

    Many fragrances are never sold at their RRP. The "saving" is measured against a price nobody paid.

    The honest test is simple. What did THIS bottle cost last month? That's the only number we compare against.

    theledgeruk.co.uk
  slides:
    - kicker: Pricing explained
      title: '"Was £120, now £60"'
      italic: is often a lie.
      sub: How fragrance "savings" are manufactured
    - title: The RRP trick
      points:
        - h: Nobody pays RRP
          b: Many bottles are never sold at RRP. Retailers quote it so a normal price looks like a saving.
        - h: The honest test
          b: What did this exact bottle cost over the last 30 days? If today isn't well below that, it's not a drop.
        - h: Our only rule
          b: We track every price daily and compare each bottle against its own history. Nothing else counts.

- slug: concentrations
  caption: |
    EDT, EDP, Parfum. What are you actually paying for?

    EDT: around 5–15% fragrance oil. Lighter, 3–5 hours.
    EDP: around 15–20%. Richer, 5–8 hours.
    Parfum / Extrait: 20–30%. Closest to skin, longest lasting.

    Cheaper isn't worse. Pick for the occasion, then let us find the price.

    theledgeruk.co.uk
  slides:
    - kicker: Fragrance basics
      title: EDT, EDP, Parfum.
      italic: What you're paying for.
      sub: Concentration, longevity, and when each one makes sense
    - title: The three strengths
      points:
        - h: Eau de Toilette
          b: Around 5–15% fragrance oil. Lighter and fresher, 3–5 hours. Daytime and summer.
        - h: Eau de Parfum
          b: Around 15–20%. Richer and longer, 5–8 hours. The sweet spot for most people.
        - h: Parfum / Extrait
          b: 20–30%. Closest to skin, longest lasting. More per ml, but you use less.

- slug: price-per-ml
  caption: |
    The 100ml is usually the real deal.

    A 50ml at £60 is £1.20 per ml. A 100ml at £85 is £0.85 per ml. Same juice, 30% cheaper.

    Only go big if you'll finish it within 2–3 years. We show £ per 10ml on every bottle so you can see it instantly.

    theledgeruk.co.uk
  slides:
    - kicker: Buying smart
      title: The 100ml is usually
      italic: the real deal.
      sub: Why bottle size matters more than the sticker price
    - title: Do the maths
      points:
        - h: Price per ml, not per bottle
          b: 50ml at £60 is £1.20 per ml. 100ml at £85 is £0.85 per ml. Same fragrance, 30% cheaper.
        - h: One caveat
          b: Only buy big if you'll finish it in 2–3 years. A bottle you don't use isn't a saving.
        - h: We show it for you
          b: Every bottle on The Ledger shows price per 10ml, so the best size is obvious at a glance.

- slug: when-to-buy
  caption: |
    The best months to buy fragrance in the UK.

    January: post-Christmas clearouts.
    Late November: Black Friday is genuine on many designer bottles.
    August: summer sales before autumn launches.

    Worst time: the two weeks before Christmas and Valentine's, when prices quietly rise.

    Or skip the calendar. We check every morning. theledgeruk.co.uk
  slides:
    - kicker: Timing
      title: The best months to buy
      italic: fragrance in the UK.
      sub: When prices genuinely fall, and when they quietly climb
    - title: The calendar
      points:
        - h: January and August
          b: Post-Christmas clearouts, then summer sales before autumn launches. Gift sets get cut hard.
        - h: Late November
          b: Black Friday is real on many designer bottles. Less so on niche.
        - h: Avoid
          b: The two weeks before Christmas and Valentine's. Prices climb when demand peaks.

- slug: our-rules
  caption: |
    How we decide a price drop is real. Three rules.

    1. At least 10% below the bottle's own 30-day median.
    2. At least £5 off.
    3. Not a price we've already announced this month.

    If it fails any one, we stay quiet. That's why we post less than other deal accounts, and why you can trust what we do post.

    theledgeruk.co.uk
  slides:
    - kicker: How we work
      title: Three rules before
      italic: we call it a drop.
      sub: Why we post less than other deal accounts
    - title: The rules
      points:
        - h: Rule one
          b: At least 10% below the bottle's own 30-day median price.
        - h: Rule two
          b: At least £5 off. A 10% drop on a £30 bottle isn't worth your attention.
        - h: Rule three
          b: Not a price we've already announced this month. No recycling the same deal.
