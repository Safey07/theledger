- slug: about
  caption: |
    What The Ledger is, and why you can trust it.

    Every morning we check hundreds of designer and niche fragrance prices across UK retailers. We compare each bottle against its own 30-day price, never a made-up RRP, and post only the drops that are genuinely 10% and £5 below it.

    Some links earn us a small commission. It never changes which drops we post. We never post a price we haven't tracked ourselves.

    Daily drops at theledgeruk.co.uk (link in bio)
  slides:
    - kicker: UK fragrance price tracker
      title: Fragrance price drops,
