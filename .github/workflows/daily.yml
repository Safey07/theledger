name: Daily run

on:
  schedule:
    - cron: "17 5 * * *"     # 05:17 UTC every day, before UK breakfast
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      evergreen_batch:
        description: "Evergreen carousels to post if there is no real price data"
        default: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install headless browser and video tools
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true

      - uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-v1

      - name: Pull feeds, detect drops, build site, email, social cards
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SIGNUP_FORM_ACTION: ${{ secrets.SIGNUP_FORM_ACTION }}
        run: python run.py

      - name: Save price history back to the repo
        run: |
          git config user.name "ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Prices $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Keep social cards for download
        uses: actions/upload-artifact@v4
        with:
          name: social-cards-and-reels
          path: output/social
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

      - uses: actions/deploy-pages@v4

      - name: Post today's top drop to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          EVERGREEN_BATCH: ${{ github.event.inputs.evergreen_batch || '1' }}
        run: python post_instagram.py
