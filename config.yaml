# Email digest. Leave provider as "none" to only write the HTML file.
email:
  provider: "none"          # "buttondown" once you have an account
  api_key_env: "BUTTONDOWN_API_KEY"

# Auto-made Reels (vertical video for Instagram and TikTok)
video:
  per_day: 3                # one Reel per top drop

# Instagram auto-posting. Stays off until IG_USER_ID and IG_ACCESS_TOKEN secrets exist.
# Never posts demo prices.
instagram:
  autopost: false           # Meta developer account locked; Instagram is scheduled in Meta Business Suite instead
  posts_per_day: 1          # the day's biggest drop
  api_version: "v25.0"

# Same posts go to the Facebook Page and TikTok. Each skips itself until its secrets exist.
facebook:
  autopost: true
  api_version: "v25.0"

tiktok:
  autopost: true            # posts stay private until TikTok audits the app, then go public automatically
