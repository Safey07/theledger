# The Ledger: automated fragrance price-drop tracker
# Edit this file, not the code.

site:
  name: "The Ledger"
  tagline: "Designer and niche fragrance price drops, checked every morning."
  base_url: "https://theledgeruk.co.uk"
  currency_symbol: "£"
  market: "UK"
  contact_email: "hello@theledgeruk.co.uk"   # forwards to the owner's inbox via Namecheap
  instagram: "theledgeruk.co"
  tiktok: "theledgeruk.co"
  facebook: "theledgeruk.co"

# Rules for what counts as a drop worth publishing
detection:
  min_drop_pct: 10          # vs the item's own 30-day median price
  min_drop_abs: 5           # ignore tiny drops (in currency units)
  history_days: 30
  max_digest_items: 12      # items in the daily email
  max_social_cards: 3       # image cards generated per day
  max_stale_days: 14        # if feeds die, keep showing the last good day's prices (labelled) this long

# Product feeds. Switching network = edit this list and add the secret. No code changes.
# url uses ${ENV_VAR} so keys never live in the repo. Unset URLs are skipped.
# format: awin | rakuten (Google-style CSV/TSV/XML, also "google") | generic_csv (needs columns:)
# Optional per feed:
#   merchant:         retailer name, for single-retailer feeds whose rows don't name it (Rakuten)
#   currency:         assumed currency when the feed's prices don't say
#   merchants_allow:  replaces the global allowlist below for this feed ([] = allow all)
#   columns:          generic_csv only, {our_field: their_column} for
#                     id, name, brand, merchant, category, url, image, price, rrp, in_stock, currency
#   delimiter:        generic_csv only, default ","
# Awin closed the account on 21 Oct 2026. Its parser stays for any Awin-format feed.
feeds:
  - name: "tfs"
    url: "${RAKUTEN_FEED_URL}"
    format: "rakuten"
    merchant: "The Fragrance Shop"
    currency: "GBP"
    merchants_allow: ["The Fragrance Shop"]

# Keep anything someone would buy as a fragrance: bottles, minis, gift sets, discovery sets, mists.
# Whole-word matching. Excludes skincare, bath and home scent.
filters:
  # Only retailers we've joined, so every link earns. A retailer shows up the day it approves us.
  # Spell names exactly as the feed does. These are Awin spellings; other networks may differ.
  merchants_allow: ["Fragrancedirect", "The Fragrance Counter", "Escentual", "allbeauty.com UK", "Perfume Click",
                    "Fragrance Click UK", "Parfumdreams UK", "Perfume Shopping", "Perfume Market UK", "Debenhams UK",
                    "Superdrug UK", "Space NK - UK", "Cult Beauty Global", "Express Chemist", "Beauti Outlet",
                    "Paco Perfumerias"]
  currency: "GBP"           # skip products priced in other currencies
  min_price: 10             # skip body sprays and other cheap non-fragrance items
  include_keywords: ["fragrance", "fragrances", "perfume", "perfumes", "parfum", "eau de parfum", "eau de toilette",
                     "eau de cologne", "cologne", "edp", "edt", "edc", "extrait", "elixir", "aftershave",
                     "after shave", "eau fraiche", "body mist", "perfume oil", "attar",
                     "discovery set", "gift set", "miniature", "travel spray"]
  exclude_keywords: ["sample", "vial", "tester", "testers", "unboxed", "decant", "decants", "body lotion", "body cream", "shower gel", "shower cream", "bath",
                     "deodorant", "deo", "deospray", "deo spray", "antiperspirant", "anti-perspirant",
                     "roll-on", "body spray", "hair mist", "hairmist", "hair perfume", "jojoba", "massage oil",
                     "carrier oil", "essential oil", "soap", "candle", "diffuser", "reed diffuser",
                     "room spray", "wax melt", "home fragrance", "car freshener", "laundry", "fabric",
                     "shampoo", "conditioner", "serum", "cleanser", "face", "moisturiser", "balm", "aftershave balm", "lip", "nail"]

# Retailer names as shown on the site, email and social posts (feed spelling: display name).
merchant_names:
  "Fragrancedirect": "Fragrance Direct"
  "allbeauty.com UK": "allbeauty"
  "Fragrance Click UK": "Fragrance Click"
  "Parfumdreams UK": "Parfumdreams"
  "Perfume Market UK": "Perfume Market"
  "Debenhams UK": "Debenhams"
  "Superdrug UK": "Superdrug"
  "Space NK - UK": "Space NK"
  "Cult Beauty Global": "Cult Beauty"

# Amazon Associates UK. Leave tag empty and no Amazon link appears anywhere on the site.
# Links are Amazon search links (no prices shown: we only show prices we have tracked ourselves).
amazon:
