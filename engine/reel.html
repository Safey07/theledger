<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Corm;src:url("__FONTS__/Cormorant.ttf");font-weight:300 700}
@font-face{font-family:Corm;src:url("__FONTS__/CormorantItalic.ttf");font-weight:300 700;font-style:italic}
@font-face{font-family:Sans;src:url("__FONTS__/Inter.ttf");font-weight:100 900}
:root{--bg:#0e0c0a;--ink:#f3ece1;--muted:#8f857a;--line:#2a2520;--gold:#c9a564;--drop:#e5826f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Sans,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"lnum" 1}
#stage{position:absolute;inset:0;transform-origin:50% 40%}
.abs{position:absolute;left:84px;right:84px;will-change:transform,opacity}
#bar{top:172px;display:flex;justify-content:space-between;align-items:center;padding-bottom:26px;border-bottom:1px solid var(--line)}
#mark{font-family:Corm;font-weight:600;font-size:46px;letter-spacing:.01em}
#mark span{color:var(--gold)}
#badge{font-weight:650;font-size:30px;letter-spacing:.04em;color:var(--bg);background:var(--drop);border-radius:99px;padding:10px 24px 9px}
#hero{top:640px;text-align:center}
#heroPct{font-family:Corm;font-style:italic;font-weight:500;font-size:430px;line-height:.9;color:var(--drop);letter-spacing:-.02em}
#heroSub{font-family:Corm;font-style:italic;font-size:66px;color:var(--ink);margin-top:34px}
#heroEye{font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-bottom:46px}
#prod{top:318px;display:flex;justify-content:space-between;align-items:flex-end;gap:36px}
#prodText{min-width:0;flex:1}
#img{width:250px;height:290px;flex:none;border-radius:18px;background:#f3ece1;display:none;align-items:center;justify-content:center;overflow:hidden}
#img img{max-width:86%;max-height:86%;object-fit:contain}
#brand{font-size:30px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.mask{overflow:hidden;padding-bottom:6px}
#title{font-family:Corm;font-weight:500;font-size:150px;line-height:1;letter-spacing:-.01em;margin-top:14px;white-space:nowrap}
#detail{font-size:32px;color:var(--muted);margin-top:16px;letter-spacing:.02em}
#rule{top:690px;height:1px;background:var(--line);transform-origin:0 50%}
#price{top:738px}
.lab{font-size:24px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
#wasRow{display:flex;align-items:baseline;gap:22px}
#was{position:relative;font-size:56px;color:var(--muted);font-weight:400}
#strike{position:absolute;left:-4px;right:-4px;top:54%;height:4px;background:var(--drop);transform-origin:0 50%}
#nowRow{display:flex;align-items:baseline;gap:22px;margin-top:6px}
#now{font-size:196px;font-weight:600;letter-spacing:-.035em;line-height:1.02}
#save{font-size:38px;color:var(--drop);font-weight:500;margin-top:4px}
#chartBox{top:1118px;right:150px}
#chartLab{display:flex;justify-content:space-between;margin-bottom:18px}
#chartLab .r{font-size:24px;color:var(--muted)}
svg{display:block;overflow:visible}
#tag{display:inline-block;margin-top:22px;font-size:26px;font-weight:600;color:#7cc3a0;border:1.5px solid #3c5c4b;border-radius:99px;padding:9px 20px 8px;letter-spacing:.02em}
#cta{top:1494px;right:150px;display:flex;align-items:center;gap:22px}
#ctaBtn{font-size:34px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:14px;padding:18px 28px 17px}
#ctaUrl{font-size:28px;color:var(--muted)}
#grain{position:absolute;inset:0;opacity:.045;pointer-events:none;background-image:url("__GRAIN__")}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(0,0,0,.55) 100%)}
</style></head>
<body>
<div id="stage">
  <div class="abs" id="bar"><div id="mark">The <span>Ledger</span></div><div id="badge"></div></div>

  <div class="abs" id="hero">
    <div id="heroEye">Price drop · today</div>
    <div id="heroPct"></div>
    <div id="heroSub"></div>
  </div>

  <div class="abs" id="prod">
    <div id="prodText">
      <div id="brand"></div>
      <div class="mask"><div id="title"></div></div>
      <div id="detail"></div>
    </div>
    <div id="img"><img id="imgEl" alt=""></div>
  </div>
  <div class="abs" id="rule"></div>

  <div class="abs" id="price">
    <div id="wasRow"><span class="lab">Usually</span><span id="was"><span id="wasTxt"></span><i id="strike"></i></span></div>
    <div id="nowRow"><span class="lab" style="color:var(--ink)">Now</span><span id="now"></span></div>
    <div id="save"></div>
  </div>

  <div class="abs" id="chartBox">
    <div id="chartLab"><span class="lab">30-day price</span><span class="r" id="shop"></span></div>
    <svg id="chart" width="846" height="230" viewBox="0 0 846 230">
      <defs><clipPath id="clip"><rect id="clipR" x="0" y="-20" width="0" height="270"/></clipPath></defs>
      <g id="grid"></g>
      <path id="area" fill="#c9a564" fill-opacity=".10" clip-path="url(#clip)"/>
      <path id="line" fill="none" stroke="#c9a564" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle id="ring" r="12" fill="none" stroke="#e5826f" stroke-width="3"/>
      <circle id="dot" r="12" fill="#e5826f"/>
    </svg>
    <div id="tag">Lowest price we've tracked</div>
  </div>

  <div class="abs" id="cta"><div id="ctaBtn">Link in bio</div><div id="ctaUrl"></div></div>
</div>
<div id="grain"></div><div id="vig"></div>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, s, e) => clamp((t - s) / (e - s));
const oCubic = x => 1 - Math.pow(1 - x, 3);
const ioCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const oExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const oBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const money = v => D.sym + v.toLocaleString("en-GB", {minimumFractionDigits: 2, maximumFractionDigits: 2});

// Static content
$("badge").textContent = "−" + D.pct + "%";
$("heroPct").textContent = "−" + D.pct + "%";
$("heroSub").textContent = D.brand + " " + D.title;
$("brand").textContent = D.brand;
$("title").textContent = D.title;
$("detail").textContent = D.detail;
$("wasTxt").textContent = money(D.was);
$("save").textContent = "You save " + money(D.was - D.now) + " at " + D.shop;
$("shop").textContent = D.shop;
$("ctaUrl").textContent = D.url;
if (!D.atl) $("tag").style.display = "none";
if (D.image) { $("img").style.display = "flex"; $("imgEl").src = D.image; }

// Fit the title on one line
(function fit() {
  const el = $("title"), max = D.image ? 640 : 912;
  let size = 150;
  while (el.scrollWidth > max && size > 78) { size -= 4; el.style.fontSize = size + "px"; }
})();

// Chart geometry
const W = 846, H = 230, pad = 14;
const pts = D.history, lo = Math.min(...pts), hi = Math.max(...pts), span = (hi - lo) || 1;
const X = i => i * (W / (pts.length - 1)), Y = v => pad + (1 - (v - lo) / span) * (H - 2 * pad);
let d = "";
pts.forEach((v, i) => { d += (i ? " L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); });
$("line").setAttribute("d", d);
$("area").setAttribute("d", d + ` L${W},${H} L0,${H} Z`);
let g = "";
for (let k = 0; k < 4; k++) { const y = (pad + k * (H - 2 * pad) / 3).toFixed(1); g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#2a2520" stroke-width="1"/>`; }
$("grid").innerHTML = g;
const len = $("line").getTotalLength();
$("line").style.strokeDasharray = len;
const lx = X(pts.length - 1), ly = Y(pts[pts.length - 1]);
["dot", "ring"].forEach(id => { $(id).setAttribute("cx", lx); $(id).setAttribute("cy", ly); });

const set = (id, o, tx = 0, ty = 0, s = 1) => {
  const e = $(id); e.style.opacity = o;
  e.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
};

// Deterministic grain jitter
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

window.render = function (t) {
  // Slow push-in on the whole frame
  $("stage").style.transform = `scale(${1 + 0.018 * prog(t, 0, D.dur)})`;

  // Beat 1: hook (0 to 1.9s)
  const hIn = oCubic(prog(t, 0, .45)), hOut = ioCubic(prog(t, 1.45, 1.95));
  set("hero", (0.25 + 0.75 * hIn) * (1 - hOut), 0, -160 * hOut + 30 * (1 - hIn), 1.1 - .1 * hIn - .25 * hOut);
  $("heroSub").style.opacity = oCubic(prog(t, .35, .85));
  $("heroEye").style.opacity = oCubic(prog(t, .15, .6));
  const b = prog(t, 1.85, 2.25);
  set("badge", b, 0, 0, .8 + .2 * oBack(b));

  // Beat 2: product (1.9 to 2.9s)
  set("brand", oCubic(prog(t, 1.95, 2.4)), 0, 24 * (1 - oCubic(prog(t, 1.95, 2.4))));
  const tt = oExpo(prog(t, 2.05, 2.75));
  $("title").style.transform = `translateY(${(1 - tt) * 110}%)`;
  set("detail", oCubic(prog(t, 2.45, 2.95)), 0, 20 * (1 - oCubic(prog(t, 2.45, 2.95))));
  $("rule").style.opacity = 1;
  $("rule").style.transform = `scaleX(${ioCubic(prog(t, 2.5, 3.2))})`;

  // Beat 3: price (2.9 to 4.8s)
  const w = oCubic(prog(t, 2.8, 3.2));
  set("wasRow", w, 0, 18 * (1 - w));
  $("strike").style.transform = `scaleX(${ioCubic(prog(t, 3.15, 3.55))})`;
  const n = oCubic(prog(t, 3.3, 3.6));
  set("nowRow", n, 0, 24 * (1 - n));
  const c = oExpo(prog(t, 3.35, 4.55));
  $("now").textContent = money(D.was - (D.was - D.now) * c);
  set("save", oCubic(prog(t, 4.45, 4.85)), 0, 14 * (1 - oCubic(prog(t, 4.45, 4.85))));

  // Beat 4: price history (4.9 to 7.2s)
  const cb = oCubic(prog(t, 4.8, 5.2));
  set("chartLab", cb, 0, 14 * (1 - cb));
  $("chart").style.opacity = cb;
  const draw = ioCubic(prog(t, 5.0, 6.5));
  $("line").style.strokeDashoffset = len * (1 - draw);
  $("clipR").setAttribute("width", W * draw);
  const dp = oBack(prog(t, 6.45, 6.75));
  $("dot").setAttribute("r", 12 * dp);
  if (t > 6.6) { const q = ((t - 6.6) % 1.3) / 1.3; $("ring").setAttribute("r", 12 + 30 * oCubic(q)); $("ring").style.opacity = 1 - q; }
  else { $("ring").style.opacity = 0; }
  const tg = oCubic(prog(t, 6.75, 7.15));
  set("tag", tg, -16 * (1 - tg), 0);

  // Beat 5: call to action (7.3s on)
  const ct = oCubic(prog(t, 7.3, 7.75));
  set("cta", ct, 0, 26 * (1 - ct));

  // Product photo (when the retailer feed supplies one)
  if (D.image) { const im = oCubic(prog(t, 2.2, 2.9)); set("img", im, 30 * (1 - im), 0, .94 + .06 * im); }
};
render(0);
</script>
</body></html>
